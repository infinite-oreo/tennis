name: Keep Supabase Alive

# Supabase 免费版项目连续 7 天无 API 请求会被自动暂停。
# 本工作流每周一、周四各 ping 一次项目，间隔 < 7 天，永久保活。
on:
  schedule:
    - cron: '0 3 * * 1,4' # 每周一、周四 UTC 03:00（北京时间 11:00）
  workflow_dispatch: {} # 支持手动触发，便于验证 Secrets 是否配置正确

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth & REST endpoints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 Secrets：请在仓库 Settings → Secrets and variables → Actions 中配置 SUPABASE_URL 与 SUPABASE_ANON_KEY"
            exit 1
          fi

          echo "→ 请求 Auth health endpoint"
          curl -sS -o /dev/null -w "auth/v1/health: HTTP %{http_code}\n" \
            --fail-with-body \
            "$SUPABASE_URL/auth/v1/health"

          echo "→ 请求 REST 网关（PostgREST 根路由）"
          curl -sS -o /dev/null -w "rest/v1: HTTP %{http_code}\n" \
            --fail-with-body \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/"
