name: Keep Supabase Alive

# Supabase 免费版项目连续 7 天无 API 请求会被自动暂停。
# 本工作流每周一、周四各 ping 一次项目，间隔 < 7 天，永久保活。
on:
  schedule:
    - cron: '0 3 * * 1,4' # 每周一、周四 UTC 03:00（北京时间 11:00）
  workflow_dispatch: {} # 支持手动触发，便于验证 Secrets 是否配置正确

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth & REST endpoints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 Secrets：请在仓库 Settings → Secrets and variables → Actions 中配置 SUPABASE_URL 与 SUPABASE_ANON_KEY"
            exit 1
          fi

          # Auth health / REST 根路由都不会触达 Postgres（前者是网关健康探针，
          # 后者缺少 Authorization 头会在 Kong 网关层被拒绝），Supabase 不会将其计入
          # 项目活跃度，之前用这两个端点保活因此持续失效。
          # 改为查询 _keepalive 表：带 apikey + Authorization 双头，真正落到数据库，
          # 且严格校验 HTTP 200，避免"看似成功实则无效"的请求被静默放过。
          echo "→ 查询 _keepalive 表（真实触达 Postgres）"
          http_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/_keepalive?select=id&limit=1")

          echo "rest/v1/_keepalive: HTTP $http_code"
          if [ "$http_code" != "200" ]; then
            echo "::error::保活查询未成功触达数据库（HTTP $http_code），请检查 Secrets 或 _keepalive 表/RLS 策略"
            exit 1
          fi
