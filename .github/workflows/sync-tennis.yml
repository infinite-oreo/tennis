name: Sync Tennis Data

# 每 2 小时从 Live Tennis API 拉取 ATP/WTA 进行中与待开赛比赛，写入 Supabase。
# 每次运行都有真实写入，同时起到 Supabase 保活作用。
# 额度：免费层每日 100 次（官方邮件确认）；每次 4 次请求 × 12 次/天 = 48，留一半余量给手动调试。
on:
  schedule:
    - cron: '7 */2 * * *' # 每 2 小时的第 7 分（避开整点高峰）
  workflow_dispatch: {} # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync to Supabase
        env:
          LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-tennis.mjs
